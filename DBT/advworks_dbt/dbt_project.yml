name: 'advworks_dbt'
version: '1.0.0'
config-version: 2

profile: 'advworks_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:

  advworks_dbt:

    prepare:
      +schema: PREPARE
      +materialized: view

    normalize:
      +schema: NORMALIZE
      +materialized: table

    schematize:
      +schema: SCHEMATIZE
      +materialized: table

    marketplace:
      +schema: MARKETPLACE
      +materialized: table




