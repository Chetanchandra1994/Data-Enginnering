
trigger:
  #- main
  - none

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: AzureCLI@2
    displayName: 'Debug Azure DevOps OIDC Token'
    inputs:
      azureSubscription: 'google-cloud-wif'
      addSpnToEnvironment: true
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        python -c "import os,base64,json; t=os.environ['idToken']; p=t.split('.')[1]; p += '='*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p)); print('SUB=' + str(c.get('sub'))); print('AUD=' + str(c.get('aud'))); print('ISS=' + str(c.get('iss'))); print('OID=' + str(c.get('oid')))"
