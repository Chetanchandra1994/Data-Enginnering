trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:

# ============================================================
# 1. TERRAFORM CI VALIDATION
# ============================================================

- stage: TerraformValidation
  displayName: 'Terraform CI Validation'

  jobs:
    - job: ValidateTerraform
      displayName: 'Validate Terraform'

      steps:

        # ----------------------------------------------------
        # Checkout
        # ----------------------------------------------------

        - checkout: self

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------

        - script: |
              curl -fsSL https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip -o /tmp/terraform.zip
              rm -rf /tmp/terraform-install
              mkdir -p /tmp/terraform-install
              unzip -o /tmp/terraform.zip -d /tmp/terraform-install
              chmod +x /tmp/terraform-install/terraform
              /tmp/terraform-install/terraform version
              echo "##vso[task.prependpath]/tmp/terraform-install"
          displayName: 'Install Terraform'

        # ----------------------------------------------------
        # Terraform Format Check
        # ----------------------------------------------------

        - script: |
            cd terraform

            terraform fmt -check -recursive

          displayName: 'Terraform Format Check'

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------

        - script: |
            cd terraform

            terraform init -backend=false

          displayName: 'Terraform Init'

        # ----------------------------------------------------
        # Terraform Validate
        # ----------------------------------------------------

        - script: |
            cd terraform

            terraform validate

          displayName: 'Terraform Validate'

# ============================================================
# 2. TERRAFORM PLAN - DEV
# ============================================================

- stage: TerraformPlanDev
  displayName: '2. Terraform Plan - DEV'

  dependsOn: TerraformValidation
  condition: succeeded()

  jobs:

    - job: TerraformPlanDev
      displayName: 'Terraform Plan DEV'

      steps:

        - checkout: self

        - template: templates/terraform-plan.yml
          parameters:
            environment: dev

        - script: |
            set -e

            export TF_VAR_snowflake_private_key_path="$(snowflakeKey.secureFilePath)"
            export TF_VAR_snowflake_private_key_passphrase="$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE"

            cd terraform

            terraform plan \
              -var-file="./environments/${{ parameters.environment }}.tfvars" \
              -out="$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}.tfplan"

          displayName: 'Terraform Plan - ${{ parameters.environment }}'

variables:
  - group: snowflake-dev-secrets