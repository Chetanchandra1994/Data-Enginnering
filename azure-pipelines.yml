trigger:
  - main

variables:
  - group: snowflake-dev-secrets

pool:
  vmImage: 'ubuntu-latest'

stages:

  - stage: Python
    displayName: '1. Python Validation'

    jobs:
      - job: PythonValidation
        displayName: 'Validate Python Code'

        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: 'Set Python 3.11'

          - script: |
              python --version
              python -m compileall python-ingestion
            displayName: 'Compile Python Code'


  - stage: DBT
    displayName: '2. dbt Validation'

    dependsOn: Python
    condition: succeeded()

    jobs:
      - job: DBTValidation
        displayName: 'Validate dbt Project'

        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: 'Set Python 3.11'

          - script: |
              python --version
              python -m pip install --upgrade pip
              pip install dbt-core dbt-snowflake
            displayName: 'Install dbt'

          - script: |
              mkdir -p ~/.dbt
              cat > ~/.dbt/profiles.yml <<'EOF'
              advworks_dbt:
                target: dev
                outputs:
                  dev:
                    type: snowflake
                    account: dummy
                    user: dummy
                    password: dummy
                    role: ACCOUNTADMIN
                    database: ADVWORKS_DEV
                    warehouse: ETL_WH_DEV
                    schema: PREPARE
                    threads: 4
              EOF

              cd DBT/advworks_dbt
              dbt parse
            displayName: 'Run dbt Parse'


  - stage: Terraform
    displayName: '3. Terraform Validation'

    dependsOn: DBT
    condition: succeeded()

    jobs:
      - job: TerraformValidation
        displayName: 'Validate Terraform Code'

        steps:
          - checkout: self

          - script: |
              curl -fsSL https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip -o /tmp/terraform.zip
              rm -rf /tmp/terraform-install
              mkdir -p /tmp/terraform-install
              unzip -o /tmp/terraform.zip -d /tmp/terraform-install
              chmod +x /tmp/terraform-install/terraform
              echo "##vso[task.prependpath]/tmp/terraform-install"
              /tmp/terraform-install/terraform version
            displayName: 'Install Terraform'

          - script: |
              cd terraform
              terraform fmt -check -recursive
            displayName: 'Terraform Format Check'

          - script: |
              cd terraform
              terraform init -backend=false
            displayName: 'Terraform Init'

          - script: |
              cd terraform
              terraform validate
            displayName: 'Terraform Validate'

  - stage: TerraformPlanDev
    displayName: '4. Terraform Plan - DEV'

    dependsOn: Terraform
    condition: succeeded()

    jobs:
      - job: TerraformPlan
        displayName: 'Create Terraform Plan for DEV'

        steps:
          - checkout: self

          - task: DownloadSecureFile@1
            name: snowflakeKey
            inputs:
              secureFile: 'snowflake_tf_key.p8'
            displayName: 'Download Snowflake Private Key'

          - script: |
              echo "Secure file path: $(snowflakeKey.secureFilePath)"
              test -f "$(snowflakeKey.secureFilePath)"
              echo "Secure key file exists."
            displayName: 'Verify Snowflake Key File'

          - script: |
              curl -fsSL https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip -o /tmp/terraform.zip
              rm -rf /tmp/terraform-install
              mkdir -p /tmp/terraform-install
              unzip -o /tmp/terraform.zip -d /tmp/terraform-install
              chmod +x /tmp/terraform-install/terraform
              echo "##vso[task.prependpath]/tmp/terraform-install"
              /tmp/terraform-install/terraform version
            displayName: 'Install Terraform'

          - script: |
              cd terraform
              terraform init -backend=false
            displayName: 'Terraform Init'

          - script: |
              cd terraform
              terraform plan -var-file=environments/dev.tfvars -var="snowflake_private_key_path=$(snowflakeKey.secureFilePath)" -out=tfplan
            displayName: 'Terraform Plan - DEV'
            env:
              TF_VAR_snowflake_private_key_passphrase: $(SNOWFLAKE_PRIVATE_KEY_PASSPHRASE)

          # - script: |
          #     cd terraform
          #     terraform plan -var-file=environments/dev.tfvars -out=tfplan
          #   displayName: 'Terraform Plan - DEV'
          #   env:
          #     TF_VAR_snowflake_private_key: $(SNOWFLAKE_PRIVATE_KEY)
          #     TF_VAR_snowflake_private_key_passphrase: $(SNOWFLAKE_PRIVATE_KEY_PASSPHRASE)