                      }
                      EOF

                      export GOOGLE_APPLICATION_CREDENTIALS="$(Pipeline.Workspace)/.workload_identity.wlconfig"

                      gcloud auth login --cred-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet

