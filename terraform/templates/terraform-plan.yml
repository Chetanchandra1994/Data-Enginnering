parameters:

  - name: environment
    type: string


steps:

  # ----------------------------------------------------------
  # Install Terraform
  # ----------------------------------------------------------

  - script: |
      set -e

      curl -fsSL https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip -o /tmp/terraform.zip
      rm -rf /tmp/terraform-install
      mkdir -p /tmp/terraform-install
      unzip -o /tmp/terraform.zip -d /tmp/terraform-install
      chmod +x /tmp/terraform-install/terraform
      /tmp/terraform-install/terraform version
      echo "##vso[task.prependpath]/tmp/terraform-install"

    displayName: 'Install Terraform'


  # ----------------------------------------------------------
  # Google Cloud WIF
  # ----------------------------------------------------------

  - template: google-wif-auth.yml


  # ----------------------------------------------------------
  # Download Snowflake Private Key
  # ----------------------------------------------------------

  - task: DownloadSecureFile@1
    name: snowflakeKey
    displayName: 'Download Snowflake Private Key'

    inputs:
      secureFile: 'snowflake_tf_key.p8'


  # ----------------------------------------------------------
  # Terraform Init
  # ----------------------------------------------------------

  - script: |
      set -e
      cd terraform
      terraform init -reconfigure

    displayName: 'Terraform Init - ${{ parameters.environment }}'

    env:
      TF_VAR_snowflake_private_key_path: $(snowflakeKey.secureFilePath)
      TF_VAR_snowflake_private_key_passphrase: $(SNOWFLAKE_PRIVATE_KEY_PASSPHRASE)


  # ----------------------------------------------------------
  # Terraform Plan
  # ----------------------------------------------------------

  - script: |
      set -e
      cd terraform

      terraform plan \
        -input=false \
        -var-file="./environments/${{ parameters.environment }}.tfvars" \
        -out="$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}.tfplan"

    displayName: 'Terraform Plan - ${{ parameters.environment }}'

    env:
      TF_VAR_snowflake_private_key_path: $(snowflakeKey.secureFilePath)
      TF_VAR_snowflake_private_key_passphrase: $(SNOWFLAKE_PRIVATE_KEY_PASSPHRASE)


  # ----------------------------------------------------------
  # Publish Plan
  # ----------------------------------------------------------

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Terraform Plan'

    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}.tfplan'
      artifact: 'terraform-plan-${{ parameters.environment }}'