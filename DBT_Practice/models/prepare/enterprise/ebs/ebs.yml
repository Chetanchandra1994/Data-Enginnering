    config:
      schema: EBS
    columns:
      - name: TASK_ID
        description: The system-generated number that uniquely identifies the task
      - name: PROJECT_ID
        description: The identifier of the project for which the task is a unit of work
      - name: TASK_NUMBER
        description: User-defined number that uniquely identifies the task within a project.  It is recommended to number tasks based on the wbs since that is how tasks are ordered in some reports.  However note task numbers do not record the wbs structure
      - name: CREATION_DATE
        description: Standard Who Column
