        description: The date on which the task starts; expenditure items with item dates before the start date cannot be entered for the task
      - name: COMPLETION_DATE
        description: The date on which the task is completed;  expenditure items with item dates after the task completion date cannot be entered for the task.  You must enter a start date to enter a completion date.
