        description: The identifier of the top task to which this tasks rolls up.  If the task is a top task, the top_task_id is set to its own task_id.
      - name: WBS_LEVEL
        description: The level of the task in the work breakdown structure
      - name: READY_TO_BILL_FLAG
        description: Flag that indicates whether the task is authorized to be invoiced.  The flag is set only for top  tasks, defaults to 'Y' upon creation of the task and is set to 'Y' or 'N' in the Control Revenue and Billing by Top Task form
      - name: READY_TO_DISTRIBUTE_FLAG
        description: Flag that indicates whether the task is authorized for revenue accrual.  The flag is set only for top tasks, defaults to 'Y' upon creation of the task, and is set to 'Y' or 'N'  in the Control Revenue and Billing by Top Task  form
      - name: PARENT_TASK_ID
        description: The identifier of the task that is the parent of the task in the project work breakdown structure
      - name: DESCRIPTION
        description: Description of the task
      - name: CARRYING_OUT_ORGANIZATION_ID
        description: The identifier of the organization that is responsible for the task work.  The project organization is defaulted to the task organization upon creation of the task
      - name: SERVICE_TYPE_CODE
        description: The type of work performed on the task
      - name: TASK_MANAGER_PERSON_ID
        description: The identifier of the employee that manages the task.
      - name: CHARGEABLE_FLAG
        description: Flag that indicates if expenditure items can be charged to the task.  Only lowest level tasks can be chargeable
      - name: BILLABLE_FLAG
        description: Default flag for items charged to the task that indicates if the item can accrue revenue (Y or N).  For capital projects this flag is used as capitalizable_flag.  For indirect projects this flag is set to N and is not used.
      - name: LIMIT_TO_TXN_CONTROLS_FLAG
        description: Flag that indicates if users can only charge expenditures to the task that are listed in task's transaction controls.  If flag =Y, then only items listed in controls are allowed. If flag = 'N' or null, then items not listed are allowed
