      - name: LABOR_SCHEDULE_DISCOUNT
        description: The percentage to be discounted from the task standard labor bill rate schedule
      - name: NON_LABOR_BILL_RATE_ORG_ID
        description: The identifier of the organization that owns the non-labor standard bill rate schedule
      - name: NON_LABOR_STD_BILL_RATE_SCHDL
