  - name: sche_dim_Sales_Branch_Office
    columns:
      - name: SALES_BRANCH_OFFICE_SK
        description: "Unique key for the sales branch office department"
        tests:
          - unique        
      - name: ORIGIN_APPLICATION_CODE
        description: "The system-of-record code for the primary application responsible for generating the source data"
      - name: ORIGIN_OFFICE_CODE
        description: "The sales office department code of the origin application"   
      - name: ORIGIN_BRANCH_OFFICE_CODE
        description: "The branch office code of the origin application"
      - name: ORIGIN_EIS_OFFICE_NAME
        description: "The office name that was manually updated into the EIS dimension for branch office"
      - name: ORIGIN_BUSINESS_UNIT_CODE
        description: "The business unit code of the origin application"
      - name: LINE_OF_BUSINESS_CODE
        description: "The code of the line of business linked to the sales branch office department"
      - name: LINE_OF_BUSINESS_NAME_FR
        description: "The name of the line of business linked to the sales branch office department in french"
      - name: LINE_OF_BUSINESS_NAME_EN
        description: "The name of the line of business linked to the sales branch office department in english"
      - name: SALES_OFFICE_DEPARTMENT_CODE
        description: "The code of the sales office department"
      - name: SALES_BRANCH_OFFICE_DEPARTMENT_CODE
        description: "The code of the sales branch office department"
      - name: SALES_BRANCH_OFFICE_DEPARTMENT_NAME_FR
        description: "The name of the sales branch office department in french"
      - name: SALES_BRANCH_OFFICE_DEPARTMENT_NAME_EN
        description: "The name of the sales branch office department in english"
  - name: sche_dim_Project_Activity
    columns:
      - name: PROJECT_ACTIVITY_SK
        description : "Unique surrogate key for the project activity" 
        tests:
          - unique
      - name: PROJECT_ACTIVITY_CODE
        description : "The code of the project activity"
      - name: PROJECT_ACTIVITY_TYPE_CODE
        description : "The type code of the project activity"
      - name: PROJECT_ACTIVITY_ACTIVE_STATUS_CODE
        description : "Indicates if the project activity is currently active for use"
  - name: sche_dim_Quoted_To_Profile
    columns:
      - name: QUOTED_TO_PROFILE_SK
        description : "Unique surrogate key for the quoted-to profile" 
        tests:
          - unique
      - name: QUOTED_TO_PROFILE_CODE
        description : "The code of the quoted-to profile"
      - name: CUSTOMER_SK
        description : "Unique surrogate key for the customer"
      - name: PROSPECT_SK
        description : "Unique surrogate key for the prospect"
  - name: sche_dim_Business_Unit
    columns: 
      - name: BUSINESS_UNIT_SK
        description: "Unique surrogate key for the business unit"
      - name: BUSINESS_UNIT_CODE
        description: "The code of the business unit"
      - name: BUSINESS_UNIT_NAME
        description: "The name of the business unit"
      - name: BUSINESS_UNIT_GROUP_NAME_FR
        description: "The group name in french of the business unit"
      - name: BUSINESS_UNIT_GROUP_NAME_EN
        description: "The group name in english of the business unit"
      - name: BUSINESS_UNIT_ACTIVE_STATUS_CODE
        description: "The code of the business unit current active or inactive status"
  - name: sche_dim_Exchange_Rate_Type
    columns: 
      - name: EXCHANGE_RATE_TYPE_SK
        description: "Unique surrogate key for the exchange rate type"
      - name: EXCHANGE_RATE_TYPE_CODE
        description: "The code of the exchange rate type"
      - name: EXCHANGE_RATE_TYPE_NAME_FR
        description: "The name in french of the exchange rate type"
      - name: EXCHANGE_RATE_TYPE_NAME_EN
        description: "The name in english of the exchange rate type"
  - name: sche_dim_Prospect
    columns: 
      - name: PROSPECT_SK
        description: "Unique surrogate key for the prospect"
        tests:
          - unique
      - name: PROSPECT_CODE
        description: "The code of the prospect"
      - name: PROSPECT_NAME
        description: "The name of the prospect"
      