# =====================================================================
# STAGE 3
# PREPROD DBT DEPLOY
# =====================================================================

- stage: preprod_dbt_deploy
  displayName: 'DBT PreProd Deploy Stage'

  dependsOn:
    - test_dbt_deploy

  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')

  jobs:

  - deployment: preprod_dbt_deploy
    displayName: 'DBT PreProd Deploy Stage'

    environment: 'PreProd - DBT'

    variables:

      # ================================================================
      # ORIGINAL CODE — KEPT
      # ================================================================

      DBT_SNOWFLAKE_ACCOUNT: $(PREPROD_DBT_SNOWFLAKE_ACCOUNT)
      DBT_SNOWFLAKE_USER: $(PREPROD_DBT_SNOWFLAKE_USER)
      DBT_SNOWFLAKE_ROLE: $(PREPROD_DBT_SNOWFLAKE_ROLE)
      DBT_SNOWFLAKE_WAREHOUSE: $(PREPROD_DBT_SNOWFLAKE_WAREHOUSE)
      DBT_SNOWFLAKE_DATABASE: $(PREPROD_DBT_SNOWFLAKE_DATABASE)
      DBT_SNOWFLAKE_SCHEMA: $(PREPROD_DBT_SNOWFLAKE_SCHEMA)
      DBT_PROFILES_DIR: $(Build.SourcesDirectory)/DBT_Practice

    strategy:
      runOnce:
        deploy:

          steps:

          # ============================================================
          # ORIGINAL CODE — KEPT
          # ============================================================

          - checkout: self
            persistCredentials: true

          # ============================================================
          # ORIGINAL CODE — KEPT
          # ============================================================

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.10'
            displayName: 'Use Python 3.10'

          - script: |
              python3.10 --version
              python3.10 -m pip install --upgrade pip
            displayName: 'Upgrade pip'

          - script: |
              python3.10 -m venv dbt-env
              echo "##vso[task.setvariable variable=VIRTUAL_ENV_PATH]$(System.DefaultWorkingDirectory)/dbt-env"
            displayName: 'Create Python Virtual Environment'

          # ============================================================
          # ORIGINAL CODE — KEPT
          # ============================================================

          - script: |
              chmod 600 $(snowflake_private_key.secureFilePath)
              echo "##vso[task.setvariable variable=DBT_SNOWFLAKE_PRIVATE_KEY_PATH]$(snowflake_private_key.secureFilePath)"
              echo "##vso[task.setvariable variable=PREPROD_DBT_SNOWFLAKE_USER]$(PREPROD_DBT_SNOWFLAKE_USER)"
              echo "##vso[task.setvariable variable=PREPROD_DBT_SNOWFLAKE_ROLE]$(PREPROD_DBT_SNOWFLAKE_ROLE)"
              echo "##vso[task.setvariable variable=PREPROD_DBT_SNOWFLAKE_WAREHOUSE]$(PREPROD_DBT_SNOWFLAKE_WAREHOUSE)"
              echo "##vso[task.setvariable variable=PREPROD_DBT_SNOWFLAKE_ACCOUNT]$(PREPROD_DBT_SNOWFLAKE_ACCOUNT)"
              echo "##vso[task.setvariable variable=PREPROD_DBT_SNOWFLAKE_DATABASE]$(PREPROD_DBT_SNOWFLAKE_DATABASE)"
              echo "##vso[task.setvariable variable=PREPROD_DBT_SNOWFLAKE_SCHEMA]$(PREPROD_DBT_SNOWFLAKE_SCHEMA)"
            displayName: 'Set DBT environment variables'

          - script: |
              source $(VIRTUAL_ENV_PATH)/bin/activate
              python3.10 -m pip install --upgrade pip
              python3.10 -m pip install dbt-core dbt-snowflake
            displayName: 'Install DBT'

          - script: |
              source $(VIRTUAL_ENV_PATH)/bin/activate
              dbt --version
            displayName: 'Verify DBT Installation'

          # ============================================================
          # ORIGINAL CODE — KEPT
          # ============================================================

          - task: DownloadSecureFile@1
            name: snowflake_private_key
            inputs:
              secureFile: 'preprod_dbt.p8'
            displayName: 'Download private key secure file'

          - script: |
              python3.10 -m pip install --upgrade pip
              if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            displayName: 'Install Python Dependencies'

          - script: |
              source $(VIRTUAL_ENV_PATH)/bin/activate
              dbt --version
              dbt deps
            workingDirectory: '$(Build.SourcesDirectory)/DBT_Practice'  
            displayName: 'Pull in dbt Dependencies'

          # ============================================================
          # ORIGINAL CODE — KEPT
          # ============================================================

          - script: |
              source $(VIRTUAL_ENV_PATH)/bin/activate
              dbt debug --target preprod
            workingDirectory: '$(Build.SourcesDirectory)/DBT_Practice'
            displayName: 'PreProd dbt Snowflake Connection'

          # ============================================================
          # ORIGINAL CODE — KEPT
          # ============================================================

          - script: |
              PR_TITLE=$(curl -s -H "Authorization: Bearer $(System.AccessToken)" \
                "https://dev.azure.com/chetanchandra81/CHETAN_PROJECT/_apis/build/builds/$(Build.BuildId)?api-version=7.0" \
                | jq -r '.triggerInfo["ci.message"]')

              echo "PR Title: $PR_TITLE"

              val_select=$(echo "$PR_TITLE" | grep -oP '(?<=dbt_select: )\S+' || echo "")
              val_selector=$(echo "$PR_TITLE" | grep -oP '(?<=dbt_selector: )\S+' || echo "")

              if [[ -n "$val_select" ]]; then
                echo "##vso[task.setvariable variable=DBT_ACTION]--select"
                echo "##vso[task.setvariable variable=DBT_VALUE]$(echo "$val_select" | xargs)"
                echo "Selected Mode: Raw Selection (--select)"
              elif [[ -n "$val_selector" ]]; then
                echo "##vso[task.setvariable variable=DBT_ACTION]--selector"
                echo "##vso[task.setvariable variable=DBT_VALUE]$(echo "$val_selector" | xargs)"
                echo "Selected Mode: YAML Selector (--selector)"
              else
