          {% elif target.name == 'prod' %}
            PROD_ENTERPRISE_MARKETPLACE
          {% endif %}

      procurement_logistics:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_ENTERPRISE_MARKETPLACE
          {% elif target.name == 'test' %}
            TEST_PROCUREMENT_LOGISTICS_MARKETPLACE
          {% elif target.name == 'preprod' %}
            PREPROD_PROCUREMENT_LOGISTICS_MARKETPLACE
          {% elif target.name == 'prod' %}
            PROD_PROCUREMENT_LOGISTICS_MARKETPLACE
          {% endif %}

      project_management:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_ENTERPRISE_MARKETPLACE
          {% elif target.name == 'test' %}
