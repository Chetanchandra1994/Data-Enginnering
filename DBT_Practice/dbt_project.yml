          {% elif target.name == 'prod' %}
            PROD_PRODUCTION_QUALITY_MARKETPLACE
          {% endif %}

      human_capital:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_ENTERPRISE_MARKETPLACE
          {% elif target.name == 'test' %}
            TEST_HUMAN_CAPITAL_MARKETPLACE
          {% elif target.name == 'preprod' %}
            PREPROD_HUMAN_CAPITAL_MARKETPLACE
          {% elif target.name == 'prod' %}
            PROD_HUMAN_CAPITAL_MARKETPLACE
          {% endif %}

      marketing_sale:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_MARKETING_SALE_MARKETPLACE
          {% elif target.name == 'test' %}
            TEST_MARKETING_SALE_MARKETPLACE
          {% elif target.name == 'preprod' %}
