    governance:
      +database: |
        {% if target.name == 'local' %}
          SANDBOX_GOVERNANCE
        {% elif target.name == 'test' %}
         TEST_GOVERNANCE
        {% elif target.name == 'preprod' %}
         PREPROD_GOVERNANCE
        {% elif target.name == 'prod' %}
         PROD_GOVERNANCE
        {% endif %}


  # Add "description" from schema.yml as COMMENT to table and columns in Snowflake
  #  CAUTION: having `columns: true` seems to break the deployment for columns that need to be quoted e.g. "F+F Core SKU"
  #  MUST turn off column comments (columns: false) if you have columns that need quotes on any models.
  #  BEST PARCTICE: avoid, if possible, using column names that need quotes e.g. "F+F Core SKU" >> ff_core_sku
  +persist_docs:
    relation: true # enables snowflake COMMENT on TABLES and VIEWS
    columns: true  # enables snowflake COMMENT on COLUMNS for TABLES only! Doesn't work for snowflake VIEWS!

  # Create SPs to allow deletion of files from the raw table
on-run-end: 
  - '{{ create_alert_schema()}}'
  - '{{ create_alert(alert1_pipe_load_fail__condition, alert1_pipe_load_fail__action, ''alert1_pipe_load_fail'')}}'
  - '{{ create_alert(alert2_pipe_inactive__condition, alert2_pipe_inactive__action, ''alert2_pipe_inactive'')}}'
  - '{{ create_alert(alert3_dynamic_tables_failed_refresh__condition, alert3_dynamic_tables_failed_refresh__action, ''alert3_dynamic_tables_failed_refresh'')}}'
  
