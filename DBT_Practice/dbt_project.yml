# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_enterprise_project'
version: '1.0.0'
config-version: 2

# Define variables here
vars:
  env_name: 'test'
  task_warehouse: "{{ target.warehouse }}"
  alert_email_address: "{{ env_var('ALERT_EMAIL', 'eisappts@enterprisegroupinc.com') if target.name == 'local' else 'eisappts@enterprisegroupinc.com' }}"

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt-enterprise-project'

# These configurations specify where dbt should look for different types of files.
# The `source-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["data","profiling"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_modules"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
models:

  dbt_enterprise_project: 
    prepare:
      enterprise:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_ENTERPRISE_PREPARE
          {% elif target.name == 'test' %}
            TEST_ENTERPRISE_PREPARE
          {% elif target.name == 'preprod' %}
            PREPROD_ENTERPRISE_PREPARE
          {% elif target.name == 'prod' %}
            PROD_ENTERPRISE_PREPARE
          {% endif %}

      corporate:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_ENTERPRISE_PREPARE
          {% elif target.name == 'test' %}
            TEST_CORPORATE_PREPARE
          {% elif target.name == 'preprod' %}
            PREPROD_CORPORATE_PREPARE
          {% elif target.name == 'prod' %}
            PROD_CORPORATE_PREPARE
          {% endif %}

      manufacturing:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_ENTERPRISE_PREPARE
          {% elif target.name == 'test' %}
            TEST_MANUFACTURING_PREPARE
          {% elif target.name == 'preprod' %}
            PREPROD_MANUFACTURING_PREPARE
          {% elif target.name == 'prod' %}
            PROD_MANUFACTURING_PREPARE
          {% endif %}

    normalize:
      enterprise:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_ENTERPRISE_NORMALIZE
          {% elif target.name == 'test' %}
            TEST_ENTERPRISE_NORMALIZE
          {% elif target.name == 'preprod' %}
            PREPROD_ENTERPRISE_NORMALIZE
          {% elif target.name == 'prod' %}
            PROD_ENTERPRISE_NORMALIZE
          {% endif %}

      corporate:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_ENTERPRISE_NORMALIZE
          {% elif target.name == 'test' %}
            TEST_CORPORATE_NORMALIZE
          {% elif target.name == 'preprod' %}
            PREPROD_CORPORATE_NORMALIZE
          {% elif target.name == 'prod' %}
            PROD_CORPORATE_NORMALIZE
          {% endif %}

      manufacturing:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_ENTERPRISE_NORMALIZE
          {% elif target.name == 'test' %}
            TEST_MANUFACTURING_NORMALIZE
          {% elif target.name == 'preprod' %}
            PREPROD_MANUFACTURING_NORMALIZE
          {% elif target.name == 'prod' %}
            PROD_MANUFACTURING_NORMALIZE
          {% endif %}

    schematize:
      enterprise:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_ENTERPRISE_SCHEMATIZE
          {% elif target.name == 'test' %}
            TEST_ENTERPRISE_SCHEMATIZE
          {% elif target.name == 'preprod' %}
            PREPROD_ENTERPRISE_SCHEMATIZE
          {% elif target.name == 'prod' %}
            PROD_ENTERPRISE_SCHEMATIZE
          {% endif %}

      corporate:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_ENTERPRISE_SCHEMATIZE
          {% elif target.name == 'test' %}
            TEST_CORPORATE_SCHEMATIZE
          {% elif target.name == 'preprod' %}
            PREPROD_CORPORATE_SCHEMATIZE
          {% elif target.name == 'prod' %}
            PROD_CORPORATE_SCHEMATIZE
          {% endif %}

      manufacturing:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_ENTERPRISE_SCHEMATIZE
          {% elif target.name == 'test' %}
            TEST_MANUFACTURING_SCHEMATIZE
          {% elif target.name == 'preprod' %}
            PREPROD_MANUFACTURING_SCHEMATIZE
          {% elif target.name == 'prod' %}
            PROD_MANUFACTURING_SCHEMATIZE
          {% endif %}
          
    marketplace:
      enterprise:
        +database: |
          {% if target.name == 'local' %}
            SANDBOX_ENTERPRISE_MARKETPLACE
          {% elif target.name == 'test' %}
            TEST_ENTERPRISE_MARKETPLACE
          {% elif target.name == 'preprod' %}
