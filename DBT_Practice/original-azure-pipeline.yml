trigger:
  branches:
    include:
      #- main
      - none

pr:
  branches:
    include:
      - "*"

variables:
  - group: test-dbt
  - group: prod-dbt
  - group: preprod-dbt
  - group: oicd-okta-dbt-test
  - group: oicd-okta-dbt-prod
  - name: python_version
    value: '3.10'
  - name: REGISTRY_URL_TEST
    value: 'northamerica-northeast1-docker.pkg.dev'
  - name: IMAGE_PATH_TEST
    value: 'prj-n-cdp-ingestion/dbt/dbt-docs'
  - name: REGISTRY_URL_PROD
    value: 'northamerica-northeast1-docker.pkg.dev'
  - name: IMAGE_PATH_PROD
    value: 'prj-p-cdp-ingestion/dbt/dbt-docs'

stages:
  - stage: dbt_ci_stage
    displayName: 'DBT CI Stage'
    condition: eq(variables['Build.Reason'], 'PullRequest')
    jobs:
      - job: dbt_ci
        displayName: 'DBT CI Pipeline'
        variables:
          DBT_SNOWFLAKE_ACCOUNT: $(TEST_DBT_SNOWFLAKE_ACCOUNT)
          DBT_SNOWFLAKE_USER: $(TEST_DBT_SNOWFLAKE_USER)
          DBT_SNOWFLAKE_ROLE: $(TEST_DBT_SNOWFLAKE_ROLE)
          DBT_SNOWFLAKE_WAREHOUSE: $(TEST_DBT_SNOWFLAKE_WAREHOUSE)
          DBT_SNOWFLAKE_DATABASE: $(TEST_DBT_SNOWFLAKE_DATABASE)
          DBT_SNOWFLAKE_SCHEMA: $(TEST_DBT_SNOWFLAKE_SCHEMA)
          DBT_PROFILES_DIR: $(Build.SourcesDirectory)

        steps:
          - checkout: self
            persistCredentials: true
          
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.10'
            displayName: 'Use Python 3.10'

          - script: |
              python3.10 --version
              python3.10 -m pip install --upgrade pip
            displayName: 'Upgrade pip'

          - script: |
              python3.10 -m venv dbt-env
              echo "##vso[task.setvariable variable=VIRTUAL_ENV_PATH]$(System.DefaultWorkingDirectory)/dbt-env"
            displayName: 'Create Python Virtual Environment'

          - script: |
              chmod 600 $(snowflake_private_key.secureFilePath)
              echo "##vso[task.setvariable variable=DBT_SNOWFLAKE_PRIVATE_KEY_PATH]$(snowflake_private_key.secureFilePath)"
              echo "##vso[task.setvariable variable=TEST_DBT_SNOWFLAKE_USER]$(TEST_DBT_SNOWFLAKE_USER)"
              echo "##vso[task.setvariable variable=TEST_DBT_SNOWFLAKE_ROLE]$(TEST_DBT_SNOWFLAKE_ROLE)"
              echo "##vso[task.setvariable variable=TEST_DBT_SNOWFLAKE_WAREHOUSE]$(TEST_DBT_SNOWFLAKE_WAREHOUSE)"
              echo "##vso[task.setvariable variable=TEST_DBT_SNOWFLAKE_ACCOUNT]$(TEST_DBT_SNOWFLAKE_ACCOUNT)"
              echo "##vso[task.setvariable variable=TEST_DBT_SNOWFLAKE_DATABASE]$(TEST_DBT_SNOWFLAKE_DATABASE)"
              echo "##vso[task.setvariable variable=TEST_DBT_SNOWFLAKE_SCHEMA]$(TEST_DBT_SNOWFLAKE_SCHEMA)"              
            displayName: 'Set DBT environment variables'

          - script: |
              source $(VIRTUAL_ENV_PATH)/bin/activate 
              python3.10 -m pip install --upgrade pip
              python3.10 -m pip install dbt-core dbt-snowflake
            displayName: 'Install DBT'

          - task: DownloadSecureFile@1
            name: snowflake_private_key
            inputs:
              secureFile: 'dev_dbt.p8'
            displayName: 'Download private key secure file'

          - script: |
              python3.10 -m pip install --upgrade pip
              if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            displayName: 'Install Python Dependencies'

          - script: |
              source $(VIRTUAL_ENV_PATH)/bin/activate 
              dbt deps
            displayName: 'Pull in dbt Dependencies'

          - script: |
              source $(VIRTUAL_ENV_PATH)/bin/activate 
              dbt debug
            displayName: 'Test dbt Snowflake Connection'

          - script: |
              PR_TITLE=$(curl -s -H "Authorization: Bearer $(System.AccessToken)" \
                "https://dev.azure.com/canamgroup/Data%20Platform/_apis/git/repositories/$(Build.Repository.Name)/pullRequests/$(System.PullRequest.PullRequestId)?api-version=7.0" \
                | jq -r '.title')

              echo "PR Title: $PR_TITLE"

              # 1. Extract values
              val_select=$(echo "$PR_TITLE" | grep -oP '(?<=dbt_select: )\S+' || echo "")
              val_selector=$(echo "$PR_TITLE" | grep -oP '(?<=dbt_selector: )\S+' || echo "")

              # 2. Determine Flag and Value
              if [[ -n "$val_select" ]]; then
                echo "##vso[task.setvariable variable=DBT_ACTION]--select"
                echo "##vso[task.setvariable variable=DBT_VALUE]$(echo "$val_select" | xargs)"
                echo "Selected Mode: Raw Selection (--select)"
              elif [[ -n "$val_selector" ]]; then
                echo "##vso[task.setvariable variable=DBT_ACTION]--selector"
                echo "##vso[task.setvariable variable=DBT_VALUE]$(echo "$val_selector" | xargs)"
                echo "Selected Mode: YAML Selector (--selector)"
              else
                echo "No dbt_select or dbt_selector found."
                echo "##vso[task.setvariable variable=DBT_ACTION]--select"
                echo "##vso[task.setvariable variable=DBT_VALUE]"
              fi
            displayName: 'Dynamic DBT Flag Construction'

          - script: |
              source $(VIRTUAL_ENV_PATH)/bin/activate 
              echo "Running dbt compile --target test $(DBT_ACTION) $(DBT_VALUE)"
              dbt compile --target test $(DBT_ACTION) $(DBT_VALUE)
            displayName: 'Test dbt Models'

          - script: |
              source $(VIRTUAL_ENV_PATH)/bin/activate 
              echo "Running dbt ls --target test $(DBT_ACTION) $(DBT_VALUE)"
              dbt ls --target test $(DBT_ACTION) $(DBT_VALUE)
            displayName: 'Listing selected models'

  - stage: test_dbt_deploy 
    displayName: 'DBT Test Deploy Stage'
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    jobs:
      - job: test_dbt_deploy
        displayName: 'DBT Test Deploy Stage'
        variables:
          DBT_SNOWFLAKE_ACCOUNT: $(TEST_DBT_SNOWFLAKE_ACCOUNT)
          DBT_SNOWFLAKE_USER: $(TEST_DBT_SNOWFLAKE_USER)
          DBT_SNOWFLAKE_ROLE: $(TEST_DBT_SNOWFLAKE_ROLE)
          DBT_SNOWFLAKE_WAREHOUSE: $(TEST_DBT_SNOWFLAKE_WAREHOUSE)
          DBT_SNOWFLAKE_DATABASE: $(TEST_DBT_SNOWFLAKE_DATABASE)
          DBT_SNOWFLAKE_SCHEMA: $(TEST_DBT_SNOWFLAKE_SCHEMA)
          DBT_PROFILES_DIR: $(Build.SourcesDirectory)

        steps:
          - checkout: self
