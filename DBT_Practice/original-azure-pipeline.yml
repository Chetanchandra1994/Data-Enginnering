                    echo "##vso[task.setvariable variable=PREPROD_DBT_SNOWFLAKE_DATABASE]$(PREPROD_DBT_SNOWFLAKE_DATABASE)"
                    echo "##vso[task.setvariable variable=PREPROD_DBT_SNOWFLAKE_SCHEMA]$(PREPROD_DBT_SNOWFLAKE_SCHEMA)"              
                  displayName: 'Set DBT environment variables'

                - script: |
                    source $(VIRTUAL_ENV_PATH)/bin/activate 
