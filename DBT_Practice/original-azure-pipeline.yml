                    val_selector=$(echo "$PR_TITLE" | grep -oP '(?<=dbt_selector: )\S+' || echo "")

                    # 2. Determine Flag and Value
                    if [[ -n "$val_select" ]]; then
                      echo "##vso[task.setvariable variable=DBT_ACTION]--select"
                      echo "##vso[task.setvariable variable=DBT_VALUE]$(echo "$val_select" | xargs)"
                      echo "Selected Mode: Raw Selection (--select)"
                    elif [[ -n "$val_selector" ]]; then
                      echo "##vso[task.setvariable variable=DBT_ACTION]--selector"
                      echo "##vso[task.setvariable variable=DBT_VALUE]$(echo "$val_selector" | xargs)"
                      echo "Selected Mode: YAML Selector (--selector)"
                    else
                      echo "No dbt_select or dbt_selector found."
                      echo "##vso[task.setvariable variable=DBT_ACTION]--select" # Default to empty select
                      echo "##vso[task.setvariable variable=DBT_VALUE]"
                    fi
                  displayName: 'Dynamic DBT Flag Construction'

                - script: |
                    source $(VIRTUAL_ENV_PATH)/bin/activate 
                    echo "Running dbt seed --target prod $(DBT_ACTION) $(DBT_VALUE)"
                    dbt seed --target prod $(DBT_ACTION) $(DBT_VALUE)
                  displayName: 'Seed Data'

                - script: |
                    source $(VIRTUAL_ENV_PATH)/bin/activate 
                    echo "Running dbt ls --target prod $(DBT_ACTION) $(DBT_VALUE)"
                    dbt ls --target prod $(DBT_ACTION) $(DBT_VALUE)
                  displayName: 'Listing selected models'

                - script: |
                    source $(VIRTUAL_ENV_PATH)/bin/activate 
                    echo "Running dbt run --target prod $(DBT_ACTION) $(DBT_VALUE)"
                    dbt run --target prod $(DBT_ACTION) $(DBT_VALUE)
                  displayName: 'Run dbt Models'
                
                - script: |
                    source $(VIRTUAL_ENV_PATH)/bin/activate
                    dbt run-operation --target prod run_all_custom_operations
                  displayName: 'Deploy Custom Operations'

                - script: |
                    source $(VIRTUAL_ENV_PATH)/bin/activate 
                    echo "Running dbt test --target prod $(DBT_ACTION) $(DBT_VALUE)"
                    dbt test --target prod $(DBT_ACTION) $(DBT_VALUE)
                  displayName: 'Test dbt Models'

                - task: DownloadSecureFile@1
                  name: google_application_credentials_prod
                  inputs:
                    secureFile: 'sa-gkecreator@prj-p-cdp-ingestion.json'
                  displayName: 'Download GCP JSON Key'
                  
                - script: |
                    chmod 600 $(google_application_credentials_prod.secureFilePath)
                    echo "##vso[task.setvariable variable=GOOGLE_APPLICATION_CREDENTIALS]$(google_application_credentials_prod.secureFilePath)"
                  displayName: 'Set Secret Variable for GCP DBT Doc deployment' 

                - script: |
                    echo "Installing Google Cloud SDK..."
                    curl -sSL https://sdk.cloud.google.com | bash
                    gcloud auth activate-service-account --key-file=$(google_application_credentials_prod.secureFilePath)
                  displayName: 'Install gcloud SDK and authenticate'  

                - script: |
                    cat $(google_application_credentials_prod.secureFilePath) | docker login -u _json_key --password-stdin https://$(REGISTRY_URL_PROD)
                  displayName: 'Login to Prod Registry'
                
                - script: |
                    source $(VIRTUAL_ENV_PATH)/bin/activate 

                    dbt docs generate --target prod
                  displayName: 'Generate documentation'

                - script: |
                    FULL_IMAGE_NAME="$(REGISTRY_URL_PROD)/$(IMAGE_PATH_PROD)"
                    docker build -t $FULL_IMAGE_NAME:latest \
                                -t $FULL_IMAGE_NAME:$(Build.BuildId) \
                                -f DockerFile .
                    docker push $FULL_IMAGE_NAME:latest
                    docker push $FULL_IMAGE_NAME:$(Build.BuildId)
                  displayName: 'Build and Push to PROD'    

                - script: |
                    source $(VIRTUAL_ENV_PATH)/bin/activate

                    FULL_IMAGE_NAME="$(REGISTRY_URL_PROD)/$(IMAGE_PATH_PROD)"

                    gcloud run deploy dbt \
                    --image $FULL_IMAGE_NAME:$(Build.BuildId) \
                    --region us-central1 \
                    --project prj-p-cdp-ingestion \
                    --service-account "cdp-ingestion-runner@prj-p-cdp-ingestion.iam.gserviceaccount.com" \
                    --platform managed \
                    --memory 128Mi \
                    --cpu 0.5 \
                    --concurrency 1 \
                    --max-instances 3 \
                    --no-cpu-boost \
                    --allow-unauthenticated \
                    --no-invoker-iam-check \
                    --set-env-vars OAUTH_CLIENT_ID="$(OKTA_CLIENT_ID_PROD)",OAUTH_CLIENT_SECRET="$(OKTA_CLIENT_SECRET_PROD)",SECRET_KEY="$(FLASK_SECRET_KEY_PROD)",SERVER_METADATA_URL="$(SERVER_METADATA_URL_PROD)"
                  displayName: 'Deploy documentation to Google Cloud Run Service in Prod'    

