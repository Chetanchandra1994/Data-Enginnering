                - script: |
                    source $(VIRTUAL_ENV_PATH)/bin/activate 
                    dbt deps
                  displayName: 'Pull in dbt Dependencies'

                - script: |
                    source $(VIRTUAL_ENV_PATH)/bin/activate 
                    dbt debug --target preprod
                  displayName: 'Prod dbt Snowflake Connection'
                
                - script: |
                    PR_TITLE=$(curl -s -H "Authorization: Bearer $(System.AccessToken)" \
                      "https://dev.azure.com/canamgroup/Data%20Platform/_apis/build/builds/$(Build.BuildId)?api-version=7.0" \
                      | jq -r '.triggerInfo["ci.message"]')

