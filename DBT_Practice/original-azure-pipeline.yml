              echo $(TEST_DBT_SNOWFLAKE_ACCOUNT)
              echo "##vso[task.setvariable variable=DBT_SNOWFLAKE_PRIVATE_KEY_PATH]$(snowflake_private_key.secureFilePath)"
              echo "##vso[task.setvariable variable=TEST_DBT_SNOWFLAKE_USER]$(TEST_DBT_SNOWFLAKE_USER)"
              echo "##vso[task.setvariable variable=TEST_DBT_SNOWFLAKE_ROLE]$(TEST_DBT_SNOWFLAKE_ROLE)"
              echo "##vso[task.setvariable variable=TEST_DBT_SNOWFLAKE_WAREHOUSE]$(TEST_DBT_SNOWFLAKE_WAREHOUSE)"
              echo "##vso[task.setvariable variable=TEST_DBT_SNOWFLAKE_ACCOUNT]$(TEST_DBT_SNOWFLAKE_ACCOUNT)"
              echo "##vso[task.setvariable variable=TEST_DBT_SNOWFLAKE_DATABASE]$(TEST_DBT_SNOWFLAKE_DATABASE)"
              echo "##vso[task.setvariable variable=TEST_DBT_SNOWFLAKE_SCHEMA]$(TEST_DBT_SNOWFLAKE_SCHEMA)"              
            displayName: 'Set DBT environment variables'

